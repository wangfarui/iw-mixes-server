# Put this file under /etc/nginx/conf.d/ or include it from your server block.
# Replace server_name and TLS settings with the existing production domain config.

upstream iw_core {
    server <private-java-server-ip>:18080;
    keepalive 16;
}

upstream iw_external {
    server 127.0.0.1:18006;
    keepalive 16;
}

map $http_origin $iw_cors_origin {
    default "";
    ~*^https?://([a-z0-9-]+\.)*itwray\.com(:[0-9]+)?$ $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 20m;

    add_header Access-Control-Allow-Origin $iw_cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
    add_header Access-Control-Allow-Headers "iwtoken,Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Remote-Share-Capability" always;
    add_header Access-Control-Expose-Headers "iwtoken" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /auth-service/ {
        proxy_pass http://iw_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bookkeeping-service/ {
        proxy_pass http://iw_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /eat-service/ {
        proxy_pass http://iw_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /points-service/ {
        proxy_pass http://iw_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Encrypted remote-share chunks must be streamed, never buffered as a whole request.
    location ^~ /external-service/api/remote-share/ {
        proxy_pass http://iw_external;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-Share-Accel 1;
    }

    # Java authorizes each chunk, then this internal location streams it without buffering in Java.
    location ^~ /_internal/remote-share/ {
        internal;
        alias /opt/iw-mixes-server/iw-external/data/remote-share/;
    }

    location /external-service/api/ {
        proxy_pass http://iw_external;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /external-service/wb/remote-share {
        access_log off;
        proxy_pass http://iw_external/wb/remote-share;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location /external-service/wb/ {
        proxy_pass http://iw_external/wb/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /external-service/internal/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://iw_external/internal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
