<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员类型迁入记账设置 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f0;color:#222;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:960px;margin:24px auto 16px;padding:0 20px}h1{font-size:22px;margin:0 0 10px}header p{color:#68736d;font-size:14px;line-height:1.7;margin:4px 0}.phone{width:390px;height:800px;margin:20px auto 32px;background:#f5f5f5;border:1px solid #ddd;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 8px 32px #0001}.nav{height:66px;padding:22px 18px 14px;background:#fafafa;display:flex;align-items:center;justify-content:space-between;font-weight:600}.back{width:42px;cursor:pointer;font-size:22px}.nav span:last-child{width:42px}.body{height:734px;overflow:auto;padding:16px 16px 142px}.card{background:#fff;border-radius:14px;overflow:hidden}.entry,.row{display:flex;align-items:center;padding:18px 16px;gap:14px;min-height:60px}.entry+.entry,.row+.row{border-top:1px solid #f0f0f0}.entry{cursor:pointer}.icon{width:36px;height:36px;border-radius:10px;background:#e2f2e9;color:#08a266;display:grid;place-items:center}.title{flex:1;min-width:0;overflow-wrap:anywhere}.desc,.note{font-size:12px;color:#999;line-height:1.7}.note{padding:12px 2px}.arrow{color:#bbb}.section{display:flex;justify-content:space-between;color:#888;font-size:14px;padding:22px 4px 14px}.link{border:0;background:transparent;color:#07a665;cursor:pointer;font:inherit}.row .link{color:#999;font-size:20px}.badge{color:#999;background:#f4f4f4;font-size:12px;padding:3px 6px;border-radius:4px}.footer{position:absolute;bottom:32px;left:16px;right:16px}.primary,.secondary{display:flex;justify-content:center;align-items:center;border:0;border-radius:12px;min-height:48px;padding:10px 16px;background:#07a665;color:white;font:16px inherit;cursor:pointer;width:100%}.secondary{background:#f0f0f0;color:#333}.mask{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:5}.sheet{width:100%;background:white;border-radius:22px 22px 0 0;padding:22px 18px 32px}.sheet h2{font-size:18px;margin:0 0 20px;overflow-wrap:anywhere}.sheet input{width:100%;height:54px;border:1px solid #ddd;border-radius:8px;padding:12px;font:16px inherit}.buttons{display:flex;gap:12px;margin-top:22px}.buttons>*{flex:1}.error{color:#d44;font-size:12px;min-height:20px;padding-top:8px}.fold{display:block;width:100%;text-align:left;padding:20px 4px;border:0;background:none;color:#888;cursor:pointer}.empty{padding:40px 12px;text-align:center;color:#999}.sort-actions{display:flex;gap:12px;font-size:13px}.row .sort-actions .link{font-size:13px;color:#07a665}.preview{max-width:480px;margin:0 auto 30px;padding:16px;border:1px solid #dbe4df;background:white;border-radius:14px;font-size:14px}.preview p{margin:8px 0;color:#777;line-height:1.6}.preview strong{display:block}.small{font-size:12px;color:#888}.hidden{display:none!important}@media(max-width:430px){header{margin-top:16px}.phone{width:100%;height:800px;margin:16px auto;border-radius:0;border:0}.preview{margin:0 12px 20px}}

.primary,.secondary,.sheet input{font-family:inherit;font-size:16px}
@media(min-width:900px){body{display:grid;grid-template-columns:minmax(180px,1fr) 390px minmax(180px,1fr);gap:28px;align-items:start;padding:24px}header{margin:0;padding:0;max-width:300px}.phone{height:calc(100vh - 48px);max-height:800px;margin:0}.body{height:calc(100% - 66px)}.preview{margin:0;max-width:300px}}
</style>
<header><h1>会员类型迁入记账设置</h1><p>交互原型，仅在本地演示新增、改名、停用、删除和排序，不连接真实接口。</p><p>已确认：只管理个人会员类型。已确认：已有订阅保留原名称，新建或主动重新选择使用当前名称。</p></header>
<div class="phone"><div class="nav"><span class="back" id="back">‹</span><span id="navTitle">记账设置</span><span>···</span></div><main class="body" id="body"></main><div class="footer hidden" id="footer"><button class="primary" id="add">＋ 新增类型</button></div><div id="overlay"></div></div>
<section class="preview"><strong>已确认的历史名称规则</strong><p>已有订阅：视频平台年度会员</p><p>记录的会员类型：<b>视频会员</b></p><p>在上方将“视频会员”改名、停用或删除，此处仍显示原名称；新建订阅使用最新可用类型。</p></section>
<script>
const state={page:'home',sorting:false,showDisabled:false,rows:[{id:1,name:'视频会员',enabled:true},{id:2,name:'音乐会员',enabled:true},{id:3,name:'软件订阅',enabled:true},{id:4,name:'其他',enabled:false}]};
const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 $('navTitle').textContent=state.page==='home'?'记账设置':'会员类型';$('footer').classList.toggle('hidden',state.page==='home'||state.sorting);$('back').style.visibility=state.page==='home'?'hidden':'visible';
 if(state.page==='home'){$('body').innerHTML='<div class="card">'+[['记账分类','整理每笔账单的用途分类','▦'],['支出标签','标记外卖、聚餐等支出场景','−'],['收入标签','标记工资、返现等收入来源','＋'],['会员类型','管理我的会员订阅类型','◇']].map(([t,d,i],n)=>`<div class="entry" ${n===3?'id="membershipEntry"':''}><span class="icon">${i}</span><div class="title">${t}<div class="desc">${d}</div></div><span class="arrow">›</span></div>`).join('')+'</div><p class="note">会员类型仅由自己管理，用于个人会员订阅。</p>';$('membershipEntry').onclick=()=>{state.page='types';render()};return;}
 const enabled=state.rows.filter(r=>r.enabled),disabled=state.rows.filter(r=>!r.enabled);
 const row=r=>`<div class="row"><span class="title">${esc(r.name)}</span>${!r.enabled?'<span class="badge">已停用</span>':''}<button class="link" onclick="menu(${r.id})" aria-label="管理${esc(r.name)}">···</button></div>`;
 $('body').innerHTML='<div class="note">仅自己管理，用于我的会员订阅</div>'+(state.sorting?`<div class="section">调整顺序<button class="link" onclick="state.sorting=false;render()">完成</button></div><div class="card">${state.rows.map((r,i)=>`<div class="row"><span class="title">${esc(r.name)}</span><span class="sort-actions"><button class="link" onclick="move(${i},-1)">上移</button><button class="link" onclick="move(${i},1)">下移</button></span></div>`).join('')}</div>`:`<div class="section"><span>已启用 · ${enabled.length} 项</span><button class="link" onclick="state.sorting=true;render()">排序</button></div><div class="card">${enabled.map(row).join('')||'<div class="empty">暂无可用类型，请点击新增</div>'}</div>${disabled.length?`<button class="fold" onclick="state.showDisabled=!state.showDisabled;render()">已停用 · ${disabled.length} 项 ${state.showDisabled?'⌃':'⌄'}</button>${state.showDisabled?'<div class="card">'+disabled.map(row).join('')+'</div>':''}`:''}`);
}
function move(i,d){const j=i+d;if(j<0||j>=state.rows.length)return;[state.rows[i],state.rows[j]]=[state.rows[j],state.rows[i]];render()}
function closeSheet(){$('overlay').innerHTML=''}
function sheet(content){$('overlay').innerHTML=`<div class="mask"><div class="sheet">${content}</div></div>`}
function editor(id){const row=state.rows.find(r=>r.id===id);sheet(`<h2>${row?'修改名称':'新增会员类型'}</h2><input id="name" placeholder="如：视频会员" value="${row?esc(row.name):''}"><div class="error" id="error"></div>${row?'<p class="small">修改后已有订阅仍保留原类型名称。</p>':''}<div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" id="save">保存</button></div>`);$('save').onclick=()=>{const name=$('name').value.trim();if(!name||Array.from(name).length>32){$('error').textContent='请输入1–32个字符';return}if(state.rows.some(r=>r.id!==id&&r.name===name)){$('error').textContent='已存在同名类型（含停用项）';return}if(row)row.name=name;else state.rows.push({id:Date.now(),name,enabled:true});closeSheet();render()};}
function menu(id){const row=state.rows.find(r=>r.id===id);sheet(`<h2>${esc(row.name)}</h2><button class="secondary" onclick="editor(${id})">修改名称</button><br><button class="secondary" onclick="toggle(${id})">${row.enabled?'停用':'启用'}类型</button><br><button class="secondary" style="color:#d44" onclick="removeType(${id})">删除类型</button><div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button></div>`)}
function toggle(id){const row=state.rows.find(r=>r.id===id);row.enabled=!row.enabled;closeSheet();render()}
function removeType(id){const row=state.rows.find(r=>r.id===id);sheet(`<h2>删除“${esc(row.name)}”？</h2><p class="note">已有订阅保留原名称，之后新建订阅不再提供此类型。</p><div class="buttons"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" id="confirmDelete">删除类型</button></div>`);$('confirmDelete').onclick=()=>{state.rows=state.rows.filter(r=>r.id!==id);closeSheet();render()}}
 $('back').onclick=()=>{state.page='home';state.sorting=false;closeSheet();render()};$('add').onclick=()=>editor();render();
</script>
</html>
